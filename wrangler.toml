# Cloudflare Worker config — makes `npx wrangler deploy` work from CI.
#
# Without an entry point wrangler assumes a static-assets site, finds nothing at
# the repo root, and fails with "Could not detect a directory containing static
# files for the project".
#
# `name` must match the Worker service already created in the dashboard
# (project-titan-omega). A different name deploys a second worker and leaves
# the custom domain pointing at the original one.
#
# No [assets] on purpose: this Worker serves no files of its own. The dashboard
# is served by the Hugging Face Space and proxied through, so there's only one
# copy of the frontend.

name = "project-titan-omega"
main = "deploy/cloudflare-worker.js"
compatibility_date = "2026-08-01"

# Keeps the *.workers.dev URL alive so the proxy can be tested before the custom
# domain is attached, and as a fallback if the domain is ever misconfigured.
workers_dev = true
