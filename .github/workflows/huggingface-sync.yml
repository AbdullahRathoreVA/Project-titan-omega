name: Sync to Hugging Face Hub

on:
  push:
    branches: [main] # Set this to your default branch
  workflow_dispatch: # Allows you to run it manually

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
          
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # HF rejects plain-git binaries (Xet policy), so deploy a single clean
        # commit with showcase media stripped — the Space never needs docs/media
        # or the promotional films in marketing/ (~40 MB of MP4 and WAV, which
        # is exactly the kind of payload that trips the same policy).
        run: |
          rm -rf docs/media marketing
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan hf-deploy
          git add -A
          git commit -m "Deploy $GITHUB_SHA"
          git push --force https://careermind2026:$HF_TOKEN@huggingface.co/spaces/careermind2026/project-titan-omega hf-deploy:main
